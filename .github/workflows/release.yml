name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.8`). Builds every cross-compile
# target Bun supports, generates SHA-256 sidecars, attaches them all to a
# fresh GitHub release. The install script (`deploy/install.sh`) consumes
# these assets by name — keep this list in sync with the script.
#
# Manual trigger via `workflow_dispatch` is also wired so you can rebuild
# release assets without re-tagging (useful when binaries get clobbered).
# Start it from the tag itself ("Use workflow from" → the tag): the run
# refuses any other ref, since the signature names the ref it started from.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)release (e.g. v0.1.8). Must already exist."
        required: true

permissions:
  contents: write   # publish releases + upload assets
  id-token: write   # cosign keyless signing via Sigstore OIDC

jobs:
  build:
    name: Build cross-compile targets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Signing and publishing run in the `release` environment, so GitHub can
    # hold them for a reviewer and limit them to v* tags (Settings >
    # Environments). Until it's configured there GitHub creates it bare and
    # the job runs as before. The signing identity stays release.yml@<tag>.
    #
    # What gates a signed release lives in GitHub settings, not here:
    #   - Settings > Rules > Rulesets: a tag ruleset on refs/tags/v* that
    #     restricts creation, update and deletion (bypass: repository admins).
    #     Whoever can push a v* tag gets a release that installers, `vaultbase
    #     update` and docker.yml accept, and this `environment:` key lives in
    #     the tagged commit, so the ruleset is what stops a writer dropping it.
    #   - Settings > Environments > release: optional required reviewers and a
    #     deployment rule limited to v* tags. With no reviewers the job runs
    #     unattended once the tag exists.
    #   - Settings > General > Releases: immutable releases, so assets can't be
    #     replaced after publication (the .sha256 and SHA256SUMS sit next to
    #     the binaries they vouch for; only the signature is out of reach).
    # Signatures can't show which of these ran: the certificate names the
    # workflow and tag, not the environment.
    environment: release
    outputs:
      tag: ${{ steps.resolve-tag.outputs.tag }}

    steps:
      # Check out the tag being released, not the default branch: a manual
      # run used to build main's code and publish it under the typed tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
          fetch-depth: 0

      - id: resolve-tag
        name: Resolve tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          TAG="$INPUT_TAG"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"; exit 1
          fi
          # The signing certificate names the ref the run started from, and
          # installs accept a release only when that ref is its own tag. A
          # manual run must be started from the tag it rebuilds (pick the tag,
          # not a branch, in "Run workflow"); from another ref its signature
          # would vouch for this build under the wrong name.
          if [ "${GITHUB_REF}" != "refs/tags/${TAG}" ]; then
            echo "::error::run this workflow from refs/tags/${TAG} (started from ${GITHUB_REF})"; exit 1
          fi
          git fetch --force --tags origin
          want="$(git rev-parse "refs/tags/${TAG}^{commit}")" || { echo "::error::tag $TAG does not exist"; exit 1; }
          have="$(git rev-parse HEAD)"
          if [ "$want" != "$have" ]; then
            echo "::error::checked out $have but $TAG points at $want"; exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${want}" >> "$GITHUB_OUTPUT"
          echo "Building release ${TAG} at ${want}"

      - name: Verify CHANGELOG entry
        # Every release needs a "## [x.y.z]" section in CHANGELOG.md; the docs
        # site renders it as the public changelog.
        run: |
          set -eu
          ver="${{ steps.resolve-tag.outputs.tag }}"
          ver="${ver#v}"
          if ! grep -q "^## \[${ver}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${ver}]' section"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: the compile target embeds this exact Bun runtime, so a Bun
          # bump changes binary size and behaviour. 1.4.4 adds ~28 MB over
          # 1.4.2 (runtime only; an empty program grows the same amount).
          # Bump deliberately after running the suite on it.
          bun-version: 1.4.4

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install admin dependencies
        # Admin has its own package.json + bun.lock — `cd admin && bun run build`
        # would otherwise hit "module not found: zustand / @types/react" in CI
        # because the root install does not descend into the admin subproject.
        working-directory: admin
        run: bun install --frozen-lockfile

      - name: Build admin SPA (embedded in binaries via Bun macro)
        # Vite + Rollup peak heap is ~2.5 GB while bundling Monaco. Default
        # Node old-space is 2 GB, so the runner OOMs without this bump.
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: bun run build:admin

      - name: Verify admin build output
        # Fail loudly if admin/dist is missing or empty — the Bun macro embeds
        # this content into every binary. An empty dist silently produces
        # binaries that serve "Admin UI not built" at /_/.
        run: |
          set -eu
          if [ ! -f admin/dist/index.html ]; then
            echo "::error::admin/dist/index.html missing — admin build did not produce output"
            ls -la admin/dist/ 2>/dev/null || echo "(admin/dist does not exist)"
            exit 1
          fi
          ASSET_COUNT=$(find admin/dist/assets -type f 2>/dev/null | wc -l)
          if [ "$ASSET_COUNT" -lt 1 ]; then
            echo "::error::admin/dist/assets has no files"
            exit 1
          fi
          echo "admin/dist OK — $(du -sh admin/dist | cut -f1), $ASSET_COUNT asset files"

      - name: Cross-compile all targets
        run: |
          mkdir -p releases
          # Bun supports cross-compile from any host — no Docker / cross-toolchain.
          bun run build:linux-x64
          bun run build:linux-arm64
          bun run build:linux-x64-musl
          bun run build:macos-x64
          bun run build:macos-arm64
          bun run build:windows-x64

      - name: Verify admin assets are embedded in each binary
        # The Bun macro inlines `admin/dist/*` as base64-encoded gzip blobs;
        # the asset *keys* (filenames) survive as literal strings in the
        # bundle. `strings(1)` is unreliable here (Bun's `--compile` writes
        # the data section in a layout strings doesn't sequence well), so
        # use `grep -a` which treats the binary as text. We expect ≥3 hits
        # for `index-`-prefixed chunks and ≥1 each for the high-signal
        # vendor chunks (primereact, monaco, react-vendor).
        run: |
          set -eu
          for f in releases/vaultbase-linux-x64 releases/vaultbase-linux-arm64 \
                   releases/vaultbase-linux-x64-musl releases/vaultbase-macos-x64 \
                   releases/vaultbase-macos-arm64 releases/vaultbase-windows-x64.exe; do
            asset_hits=$(grep -ac 'index-' "$f" || true)
            primereact_hits=$(grep -ac 'primereact' "$f" || true)
            monaco_hits=$(grep -ac 'monaco' "$f" || true)
            echo "  $f → index- $asset_hits / primereact $primereact_hits / monaco $monaco_hits"
            if [ "$asset_hits" -lt 3 ] || [ "$primereact_hits" -lt 1 ] || [ "$monaco_hits" -lt 1 ]; then
              echo "::error::$f does not appear to have the admin SPA embedded"
              exit 1
            fi
          done

      - name: Compress Linux binaries (xz)
        # ~100 MB binaries shrink to ~30 MB. install.sh downloads the .xz when
        # `xz` is available and falls back to the raw binary otherwise; it
        # verifies .sha256 / .sig against the decompressed binary, so the
        # raw assets stay the source of truth.
        run: |
          set -eu
          cd releases
          for f in vaultbase-linux-x64 vaultbase-linux-arm64 vaultbase-linux-x64-musl; do
            xz -6 -T0 -k -f "$f"
            xz -t "$f.xz"
            echo "  $f: $(du -h "$f" | cut -f1) → $(du -h "$f.xz" | cut -f1)"
          done

      - name: Generate SHA-256 sidecars
        run: |
          cd releases
          for f in vaultbase-*; do
            # Skip already-generated .sha256 files (rerun safety).
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" | awk -v name="$f" '{ print $1 "  " name }' > "${f}.sha256"
          done
          ls -la

      - name: Generate combined SHA256SUMS
        run: |
          cd releases
          # One file with all hashes — easier to verify with a single download:
          #   curl -O .../SHA256SUMS && sha256sum -c SHA256SUMS
          cat vaultbase-*.sha256 \
            | grep -v '^$' \
            > SHA256SUMS
          cat SHA256SUMS

      # ── SBOM via syft ────────────────────────────────────────────────────
      # CycloneDX JSON next to each binary lets downstream consumers know what
      # was bundled — drop into trivy / grype / dependency-track to track
      # advisories per release.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.20.0

      # A compiled Bun binary carries no package metadata, so scanning the
      # binary (or, from inside releases/, the binaries folder) found nothing:
      # every SBOM listed zero components. The dependencies are the installed
      # packages of the server and the admin it embeds, so each binary's SBOM
      # is a scan of the checked-out tree with them installed, named after
      # the binary. The step fails if an SBOM comes out empty.
      - name: Generate SBOMs (CycloneDX JSON per binary)
        run: |
          set -eu
          ver="${{ steps.resolve-tag.outputs.tag }}"
          scan() { syft "dir:${GITHUB_WORKSPACE}" --exclude './releases' --exclude './.git' \
            --source-name "$1" --source-version "${ver#v}" -o cyclonedx-json; }
          cd releases
          for f in vaultbase-linux-x64 vaultbase-linux-arm64 vaultbase-linux-x64-musl \
                   vaultbase-macos-x64 vaultbase-macos-arm64 vaultbase-windows-x64.exe; do
            echo "→ SBOM for $f"
            scan "$f" > "${f}.cdx.json"
          done
          scan vaultbase-source > vaultbase-source.cdx.json
          for f in *.cdx.json; do
            n="$(jq '.components | length' "$f")"
            echo "$f: $n components"
            if [ "$n" -lt 10 ]; then echo "::error::$f lists only $n components"; exit 1; fi
          done

      # ── Cosign keyless sigs ─────────────────────────────────────────────
      # Uses the GitHub Actions OIDC token via Sigstore Fulcio — no static
      # signing key to manage. Verifiers check the cert chain + transparency
      # log entry. install.sh and install.ps1 check these by default when
    # cosign is on PATH, as do `vaultbase update` and docker.yml.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts (keyless)
        run: |
          cd releases
          for f in vaultbase-linux-x64 vaultbase-linux-arm64 vaultbase-linux-x64-musl \
                   vaultbase-macos-x64 vaultbase-macos-arm64 vaultbase-windows-x64.exe \
                   SHA256SUMS; do
            echo "→ signing $f"
            cosign sign-blob --yes \
              --output-signature="${f}.sig" \
              --output-certificate="${f}.pem" \
              "$f"
            # A Sigstore bundle too: what current cosign verifies with
            # (--certificate/--signature are deprecated in cosign 3). cosign 2
            # writes the standard format only when asked; 3 does by default.
            NEWFMT=""
            if cosign version 2>/dev/null | grep -Eq 'GitVersion:[[:space:]]+v2\.'; then NEWFMT="--new-bundle-format"; fi
            cosign sign-blob --yes $NEWFMT --bundle "${f}.sigstore.json" "$f"
            # Verified here, with the identity installers pin, before anything
            # is published: a bundle no verifier accepts must fail the release.
            cosign verify-blob $NEWFMT --bundle "${f}.sigstore.json" \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$f"
          done
          ls -la *.sig *.pem *.sigstore.json

      - name: Prepare release notes
        # release-notes/<tag>.md (upgrade notes, highlights) goes above the
        # auto-generated commit list. Empty when the file doesn't exist.
        run: |
          f="release-notes/${{ steps.resolve-tag.outputs.tag }}.md"
          if [ -f "$f" ]; then cp "$f" release-body.md; else : > release-body.md; fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve-tag.outputs.tag }}
          name: ${{ steps.resolve-tag.outputs.tag }}
          body_path: release-body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            releases/vaultbase-linux-x64
            releases/vaultbase-linux-x64.sha256
            releases/vaultbase-linux-x64.sig
            releases/vaultbase-linux-x64.pem
            releases/vaultbase-linux-x64.sigstore.json
            releases/vaultbase-linux-x64.cdx.json
            releases/vaultbase-linux-x64.xz
            releases/vaultbase-linux-x64.xz.sha256
            releases/vaultbase-linux-arm64
            releases/vaultbase-linux-arm64.sha256
            releases/vaultbase-linux-arm64.sig
            releases/vaultbase-linux-arm64.pem
            releases/vaultbase-linux-arm64.sigstore.json
            releases/vaultbase-linux-arm64.cdx.json
            releases/vaultbase-linux-arm64.xz
            releases/vaultbase-linux-arm64.xz.sha256
            releases/vaultbase-linux-x64-musl
            releases/vaultbase-linux-x64-musl.sha256
            releases/vaultbase-linux-x64-musl.sig
            releases/vaultbase-linux-x64-musl.pem
            releases/vaultbase-linux-x64-musl.sigstore.json
            releases/vaultbase-linux-x64-musl.cdx.json
            releases/vaultbase-linux-x64-musl.xz
            releases/vaultbase-linux-x64-musl.xz.sha256
            releases/vaultbase-macos-x64
            releases/vaultbase-macos-x64.sha256
            releases/vaultbase-macos-x64.sig
            releases/vaultbase-macos-x64.pem
            releases/vaultbase-macos-x64.sigstore.json
            releases/vaultbase-macos-x64.cdx.json
            releases/vaultbase-macos-arm64
            releases/vaultbase-macos-arm64.sha256
            releases/vaultbase-macos-arm64.sig
            releases/vaultbase-macos-arm64.pem
            releases/vaultbase-macos-arm64.sigstore.json
            releases/vaultbase-macos-arm64.cdx.json
            releases/vaultbase-windows-x64.exe
            releases/vaultbase-windows-x64.exe.sig
            releases/vaultbase-windows-x64.exe.pem
            releases/vaultbase-windows-x64.exe.sigstore.json
            releases/vaultbase-windows-x64.exe.cdx.json
            releases/SHA256SUMS
            releases/SHA256SUMS.sig
            releases/SHA256SUMS.pem
            releases/SHA256SUMS.sigstore.json
            releases/vaultbase-source.cdx.json
