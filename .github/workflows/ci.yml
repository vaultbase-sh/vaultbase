name: CI

# Type-check and test every push and every pull request. Releases
# (`release.yml`) build binaries but do not run the suite, so this is the
# gate that keeps main shippable.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Weekly, so a change to the runners or to a Postgres image shows up
  # without waiting for a push.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Same pinned runtime as release.yml.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  server-postgres:
    name: Server (tests on Postgres ${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One version failing shouldn't hide how the others did.
      fail-fast: false
      matrix:
        # Every supported major, so a new one is tested before users run it.
        pg: ["16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_USER: vaultbase
          POSTGRES_PASSWORD: vaultbase
          POSTGRES_DB: vaultbase
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pg_dump
        # Backups on Postgres run pg_dump, which refuses a server newer than
        # itself: the client matches the server's major. From the PostgreSQL
        # apt repo: the runner's own Ubuntu release may not ship that client
        # (Ubuntu 26 has no postgresql-client-16).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-${{ matrix.pg }}

      - name: Test on Postgres
        # Every initDb(":memory:") opens a fresh schema on the service
        # (src/db/client.ts); SQLite-only suites skip themselves.
        env:
          VAULTBASE_TEST_DB: postgres://vaultbase:vaultbase@127.0.0.1:5432/vaultbase
        run: bun test --timeout 20000

  admin:
    name: Admin UI (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (tsc -b + vite build)
        # Vite + Rollup peak heap is ~2.5 GB while bundling Monaco.
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: bun run build
