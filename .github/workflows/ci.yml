name: CI

# Type-check and test every push and every pull request. Releases
# (`release.yml`) build binaries but do not run the suite, so this is the
# gate that keeps main shippable.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Same pinned runtime as release.yml.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  server-postgres:
    name: Server (tests on Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaultbase
          POSTGRES_PASSWORD: vaultbase
          POSTGRES_DB: vaultbase
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pg_dump
        # Backups on Postgres run pg_dump; the client must match the server (16).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16

      - name: Test on Postgres
        # Every initDb(":memory:") opens a fresh schema on the service
        # (src/db/client.ts); SQLite-only suites skip themselves.
        env:
          VAULTBASE_TEST_DB: postgres://vaultbase:vaultbase@127.0.0.1:5432/vaultbase
        run: bun test --timeout 20000

  admin:
    name: Admin UI (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (tsc -b + vite build)
        # Vite + Rollup peak heap is ~2.5 GB while bundling Monaco.
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: bun run build
