name: Docker image

# Publishes ghcr.io/vaultbase-sh/vaultbase for a release: the release's own
# Linux binaries (checked against its SHA256SUMS) on Debian slim, for amd64
# and arm64, tagged X.Y.Z, X.Y and latest. See deploy/docker/Dockerfile.
#
# Runs after every successful Release run, by hand for a given tag, and when
# the image's files change on main (then for the latest release).
#
# Only binaries signed by this repository's release.yml for that exact tag
# go in (the identity install.sh --verify-sig checks), and only the newest
# release moves :latest and the newest patch of a minor moves :X.Y, so
# rebuilding an old tag can't roll default deployments back.
#
# The pushed image is signed with cosign keyless. Every run that can publish
# uses this file from the default branch (workflow_run and push always do;
# a manual run started from any other ref is skipped), so the signature names
# docker.yml@refs/heads/main. Check an image with:
#
#   cosign verify ghcr.io/vaultbase-sh/vaultbase:<tag> \
#     --certificate-identity https://github.com/vaultbase-sh/vaultbase/.github/workflows/docker.yml@refs/heads/main \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# The ref check below is in this file, so a branch copy can drop it; what it
# can't do is sign as refs/heads/main, which is what the verify above pins.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the image for (e.g. v0.25.0)"
        required: true
  push:
    branches: [main]
    paths:
      - "deploy/docker/**"
      - ".github/workflows/docker.yml"

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless signing of the pushed image

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  image:
    name: Build and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # workflow_run matches workflows by name only: a fork's pull request can
    # add one called "Release" on a branch named like an old tag. Accept only
    # this repository's release.yml, run from this repository by a push.
    # A manual run must use this file from the default branch: dispatched
    # from another ref it would sign the image as that ref.
    if: >-
      (github.event_name != 'workflow_dispatch' ||
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      (github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.repository.full_name == github.repository &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.path == '.github/workflows/release.yml' ||
         startsWith(github.event.workflow_run.path, '.github/workflows/release.yml@'))
      ))
    steps:
      - id: tag
        name: Resolve the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -eu
          case "$EVENT" in
            workflow_dispatch) tag="$INPUT_TAG" ;;
            workflow_run)      tag="$RUN_TAG" ;;
            *)                 tag="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r .tag_name)" ;;
          esac
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a release tag (vX.Y.Z)"; exit 1
          fi
          ver="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "minor=${ver%.*}" >> "$GITHUB_OUTPUT"
          echo "Image for $tag"

      # The Dockerfile and entrypoint as of that tag, when they exist there;
      # otherwise (a release made before the image existed) as on main.
      - uses: actions/checkout@v4
      - id: channels
        name: Use the tag's image files if it has them
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          MINOR: ${{ steps.tag.outputs.minor }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -eu
          git fetch --depth=1 --force origin "+refs/tags/*:refs/tags/*"
          commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")" || { echo "::error::tag $TAG does not exist"; exit 1; }
          # After a Release run the tag must still be the commit it built and
          # signed: moved since, the image would mix files and binaries.
          if [ "$EVENT" = workflow_run ] && [ "$commit" != "$RUN_SHA" ]; then
            echo "::error::$TAG points at $commit, but the Release run built $RUN_SHA"; exit 1
          fi
          if git cat-file -e "$commit:deploy/docker/Dockerfile" 2>/dev/null; then
            git checkout "$commit" -- deploy/docker
          fi
          # Channel tags only move forward: :latest for the newest release,
          # :X.Y for the newest patch of X.Y.
          releases="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)"
          newest="$(printf '%s\n' "$releases" | tail -n1)"
          newest_minor="$(printf '%s\n' "$releases" | awk -v p="v$MINOR." 'index($0, p) == 1' | tail -n1)"
          tags="$IMAGE:$VERSION"
          if [ "$newest_minor" = "$TAG" ]; then tags="$(printf '%s\n%s' "$tags" "$IMAGE:$MINOR")"; else echo "::notice::$newest_minor is newer, :$MINOR stays"; fi
          if [ "$newest" = "$TAG" ]; then tags="$(printf '%s\n%s' "$tags" "$IMAGE:latest")"; else echo "::notice::$newest is newer, :latest stays"; fi
          printf 'tags<<EOF\n%s\nEOF\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download and verify the release binaries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          mkdir -p deploy/docker/bin
          curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
          # A SHA256SUMS from the same release proves nothing on its own: who
          # can replace the binaries can replace it too. Its signature must
          # come from this repository's release.yml run for this tag, the
          # same identity install.sh --verify-sig and vaultbase update check.
          # The Sigstore bundle when the release has one (v0.39.1 on); the
          # .sig/.pem pair (deprecated flags in cosign 3) for older tags.
          identity="https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/$TAG"
          issuer="https://token.actions.githubusercontent.com"
          if curl -fsSL -o SHA256SUMS.sigstore.json "$base/SHA256SUMS.sigstore.json"; then
            # cosign 2 reads the standard bundle format only when asked.
            NEWFMT=""
            if cosign version 2>/dev/null | grep -Eq 'GitVersion:[[:space:]]+v2\.'; then NEWFMT="--new-bundle-format"; fi
            cosign verify-blob $NEWFMT --bundle SHA256SUMS.sigstore.json \
              --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" SHA256SUMS
          else
            curl -fsSL -o SHA256SUMS.sig "$base/SHA256SUMS.sig"
            curl -fsSL -o SHA256SUMS.pem "$base/SHA256SUMS.pem"
            cosign verify-blob --certificate SHA256SUMS.pem --signature SHA256SUMS.sig \
              --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" SHA256SUMS
          fi
          for arch in x64:amd64 arm64:arm64; do
            src="vaultbase-linux-${arch%%:*}"; dst="deploy/docker/bin/vaultbase-linux-${arch##*:}"
            curl -fsSL -o "$dst" "$base/$src"
            want="$(grep " $src\$" SHA256SUMS | awk '{print $1}')"
            have="$(sha256sum "$dst" | awk '{print $1}')"
            if [ -z "$want" ] || [ "$want" != "$have" ]; then echo "::error::$src checksum mismatch"; exit 1; fi
            echo "$src ok"
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/docker
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.channels.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Vaultbase
            org.opencontainers.image.description=Self-hosted backend in a single binary
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.licenses=MIT

      # Signs the multi-arch index by digest, which covers every tag pushed
      # above and both platforms. The signature goes to ghcr.io next to the
      # image (login above) and into the Rekor transparency log.
      - name: Sign the image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in sha256:*) ;; *) echo "::error::no image digest from the build"; exit 1 ;; esac
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Smoke test the amd64 image
        run: |
          set -eu
          img="ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}"
          docker run -d --name vb -p 8091:8091 -e VAULTBASE_READ_WORKERS=0 "$img"
          for i in $(seq 30); do curl -fsS localhost:8091/api/health && break; sleep 1; done
          curl -fsS localhost:8091/_/ready
          docker logs vb 2>&1 | grep -q "Setup key:" || { echo "::error::no setup key in the log"; docker logs vb; exit 1; }
          docker rm -f vb
          # Backups and restore on Postgres run these; images of releases
          # before 0.29.0 (built from their own Dockerfile) don't have them.
          if grep -q pg_dump deploy/docker/Dockerfile; then
            for platform in linux/amd64 linux/arm64; do
              docker run --rm --platform "$platform" --entrypoint sh "$img" -c 'pg_dump --version && pg_restore --version && psql --version'
            done
          fi
