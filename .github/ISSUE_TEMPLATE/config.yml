# The "New issue" chooser. Issues are for bugs; questions and ideas go to Discussions.
blank_issues_enabled: false
contact_links:
  - name: Ask a question
    url: https://github.com/vaultbase-sh/vaultbase/discussions/categories/q-a
    about: How do I…? Setup, rules, hooks, the SDK, deployment. Answers can be marked, so the next person finds them.
  - name: Suggest a feature
    url: https://github.com/vaultbase-sh/vaultbase/discussions/categories/ideas
    about: Something you want, or a different order for the roadmap. Say what you're building and what's in your way.
  - name: Report a security issue
    url: https://github.com/vaultbase-sh/vaultbase/security/policy
    about: Please don't open a public issue for a vulnerability. Follow the security policy instead.
  - name: Read the docs
    url: https://docs.vaultbase.dev
    about: Installation, collections and rules, auth, realtime, files, hooks and the SDK.
